<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!---Title of webpage-->
    <title>Responsive Website Project</title>

    <!---Adding my css link--->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="canvas-container">
    
    
    <!---Add a main-->
    <main>
       

        <!---<Section> tag always goes inside of <main>-->

            <!---Adding two sections for two boxes results and summary bc they will have their own box-->
            <section class="result">
             <h1>Your Result</h1>

             <!---I will use div for styling purposes for my container-->
                <div class="score-circle">
                    <!---I will use <span> to group text for target styling in css-->
                    <span class="score-number">76</span>
                    <span class="score-total">of 100</span>
                </div>
                <h3>Great</h3>
                    <p>You scored higher than 65% of the people who have taken these tests.</p>
            </section>


            <section class="summary">
                <h2>Summary</h2>

                <div class="summary-score">
                    <!---Will put a ul and li to list all summaries--->

                    <ul>

                        <!---Reaction section-->


                        <li class="summary-reaction">
                            <div class="item-title">
                                <img src="./images/icon-reaction.svg" alt="reaction icon">
                                <span><b>Reaction</b></span>
                                
                            </div>
                            <p class="item-score"><span class="user-score"><b>80</b></span> / 100</p>
                        </li>


                        <!---Memory section-->


                        <li class="summary-memory">
                            <div class="item-title">
                                <img src="./images/icon-memory.svg" alt="memory icon">
                                <span><b>Memory</b></span>
                                
                            </div>
                            <p class="item-score"><span class="user-score"><b>92</b></span> / 100</p>
                        </li>


                        <!---Verbal section-->

                        <li class="summary-verbal">
                            <div class="item-title">
                                <img src="./images/icon-verbal.svg" alt="verbal icon">
                                <span><b>Verbal</b></span> 
                                                        
                            </div>
                        <p class="item-score"><span class="user-score"><b>61</b></span> / 100</p>
                        </li>
                        <!---Visual Section-->

                        <li class="summary-visual">
                            <div class="item-title">
                                <img src="./images/icon-visual.svg" alt="visual icon">
                                <span><b>Visual</b></span>
                                
                            </div>
                            <p class="item-score"><span class="user-score"><b>73</b></span> / 100</p>
                        </li>
                    </ul>
                </div>

                <!---I will now add a button. because this isnt a form we using a input button--->
                <button type="button" class="btn-continue"><b>Continue</b></button>
            </section>
            
    </main>
    </div>
    <footer>
        <!---Frontend Mentor attribution-->
    </footer>
    
</body>
</html>
